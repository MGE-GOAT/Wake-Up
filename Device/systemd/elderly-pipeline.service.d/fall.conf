[Service]
# ncnn (fall_cpp yolo11n) uses OpenMP. Its workers spin-wait between calls by default, which burns the
# cores the wake word needs. PASSIVE makes them sleep. The fall worker also runs at nice 10 (FALL_NICE in
# fall_adapter.cpp), so the wake word and camera win any contention. FALL_CPU_AFFINITY="2,3" would pin it.
Environment=OMP_WAIT_POLICY=PASSIVE
Environment=FALL_CPP_CONFIG=fall_cpp/noban.yaml
