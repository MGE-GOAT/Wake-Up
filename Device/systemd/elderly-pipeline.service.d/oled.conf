[Service]
# The OLED is now driven by the persistent interactive-eyes daemon
# (elderly-oled.service). The pipeline only writes the current eye state to
# OLED_STATE_FILE (setOled() in main.cpp); the daemon renders/animates it.
# (Replaces the old one-shot brand splash via show_noban.py.)
Environment=OLED_STATE_FILE=/tmp/noban_oled_state
