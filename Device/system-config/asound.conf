# Default device: WUW pipeline (main.cpp) opens "default" as mono capture +
# playback. Route capture to the INMP441 LEFT channel (L/R->GND) as raw mono
# (ttable 1 — MIC_SCALE in C++ handles level), and playback to the MAX98357A amp.
pcm.!default {
    type asym
    capture.pcm  "micleft"
    playback.pcm "plughw:CARD=sndrpigooglevoi,DEV=0"
}
ctl.!default { type hw; card sndrpigooglevoi }

# Call mic (legacy SPH0645/INMP441 right-channel + gain). Kept for reference.
pcm.callmic {
    type plug
    slave.pcm {
        type route
        slave.pcm "hw:CARD=sndrpigooglevoi,DEV=0"
        slave.channels 2
        ttable.0.1 32
    }
}

# INMP441 on the LEFT channel (L/R->GND): left->mono, no gain. Used by the WUW
# default capture AND the call helper (MIC_DEVICE=micleft). The call helper
# applies its own high-pass (fan removal) + gain via MIC_FILTER.
pcm.micleft {
    type plug
    slave.pcm {
        type route
        slave.pcm "hw:CARD=sndrpigooglevoi,DEV=0"
        slave.channels 2
        ttable.0.0 1
    }
}
