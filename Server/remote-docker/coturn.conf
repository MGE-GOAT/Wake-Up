# coturn — TURN relay so calls work for caregivers behind strict/symmetric NAT
# (Janus host candidates + STUN cover most cases; TURN is the fallback).
# Replace PUBLIC_IP and the secret before deploying.
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=PUBLIC_IP
realm=noban
# Long-term credentials (simple). For production prefer use-auth-secret + REST API.
user=noban:CHANGE_ME_STRONG_SECRET
# Relay UDP port range — open these in the firewall.
min-port=49152
max-port=65535
fingerprint
no-cli
# log-file=/var/log/turnserver.log
#
# Point the app + device ICE config at this TURN server, e.g.:
#   {"urls":"turn:PUBLIC_IP:3478","username":"noban","credential":"CHANGE_ME_STRONG_SECRET"}
