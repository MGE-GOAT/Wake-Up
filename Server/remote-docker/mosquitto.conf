# Noban MQTT broker (mosquitto v2) — server→device/app push + heartbeats.
# Mounted by docker-compose at /mosquitto/config/mosquitto.conf (read-only).
# Plain MQTT on 1883 (exposed by compose). The API (mqtt_pub.py), the device,
# and the app all connect here.

listener 1883 0.0.0.0

# Current clients connect without credentials. For a public deployment, switch to
# password_file / TLS (see REMOTE_DEPLOYMENT.md §5 hygiene) and flip this to false.
allow_anonymous true

# Messages are transient push (commands + heartbeat); no on-disk persistence needed.
persistence false

# Log to stdout so `docker compose logs mosquitto` shows broker activity.
log_dest stdout
log_type warning
log_type notice
log_type information

# Keepalive / connection limits (sane defaults for a few hundred devices).
max_keepalive 120
